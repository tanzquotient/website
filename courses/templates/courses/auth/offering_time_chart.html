{% load basic_tags %}

{% autoescape off %}
<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
        {% for trace in chart.traces %}
            var trace{{ forloop.counter }} = {
                type: 'bar',
                name: '{{ trace.name }}',
                x: {{ trace.x }},
                y: {{ trace.y }},
                mode: 'lines',
            };
            console.log({{ trace.y }})
        {% endfor %}

        var trace_total = {
            type: 'scatter',
            name: 'TOTAL',
            x: {{ chart.trace_total.x }},
            y: {{ chart.trace_total.y }},
            yaxis: 'y2',
            line: { color: '#C51718', width: 5,},
            mode: 'lines',
        };


        var data = [{% for trace in chart.traces %}trace{{ forloop.counter }},{% endfor %} trace_total];

        var layout = {
            title: {text: 'Timeline'},
            height: 800,
            barmode: 'stack',
            xaxis: {
                title: {text: 'date'},
                type: 'date',
            },
            yaxis: {
                title: {text: 'individual course subscriptions'},
            },
            yaxis2: {
                title: {text: 'TOTAL subscriptions'},
                side: 'right',
                overlaying: 'y',
                tickmode: 'auto',
            },
            legend: {
                x: -0.2,
                xanchor: 'right',
                traceorder:"reversed",
            }
        };

        console.log(data)

        Plotly.newPlot(document.getElementById('chart-time-{{ offering.id }}'), data, layout);
    });
</script>
{% endautoescape %}
<div class="chart" id="chart-time-{{ offering.id }}"></div>
