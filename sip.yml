---
postgres:
  - name: tq-website

s3:
  - name: tq-media
  - name: tq-static
  - name: tq-postfinance

ingress:
  - subdomain: www
    cname: tanzquotient.org
    http:
      - path: /
        port: 8080

sidecar:
  - name: redis
    template: redis
    values:
      version: "7.0.4"

resources:
  requests:
    memory: 2.5G
    cpu: 1
  limits:
    memory: 5G
    cpu: 2

# When editing those, you MUST update the deployment(s) with sipctl as well!
env:
  - name: SIP_TQ_DJANGO_SECRET_KEY
    secret:
      key: tq-django-secret-key
      create: random
  - name: SIP_TQ_GOOGLE_ANALYTICS_PROPERTY_ID
    secret:
      key: tq-google-analytics-property-id
      create: provided
  - name: SIP_TQ_PAYMENT_ACCOUNT_IBAN
    secret:
      key: tq-payment-account-iban
      create: provided
  - name: SIP_TQ_PAYMENT_ACCOUNT_SWIFT
    secret:
      key: tq-payment-account-swift
      create: provided
  - name: SIP_TQ_PAYMENT_ACCOUNT_POST_NUMBER
    secret:
      key: tq-payment-account-post-number
      create: provided
  - name: SIP_TQ_PAYMENT_ACCOUNT_RECIPIENT
    secret:
      key: tq-payment-account-recipient
      create: provided
  - name: SIP_TQ_PAYMENT_ACCOUNT_RECIPIENT_ZIPCODE_CITY
    secret:
      key: tq-payment-account-recipient-zipcode-city
      create: provided
  - name: SIP_TQ_PAYREXX_INSTANCE
    secret:
      key: tq-payrexx-instance
      create: provided
  - name: SIP_TQ_PAYREXX_API_KEY
    secret:
      key: tq-payrexx-api-key
      create: provided
  - name: SIP_TQ_PAYREXX_WEBHOOK_SIGNING_KEY
    secret:
      key: tq-payrexx-webhook-signing-key
      create: provided
  - name: SIP_TQ_METRICS_BASIC_AUTH_PASSWORD
    secret:
      key: tq-metrics-basic-auth-password
      create: provided
  - name: SIP_TQ_REDIS_URL
    secret:
      key: tq-redis-url
      value: provided

  # These differ between deployments but aren't necessarily "secret"
  - name: SIP_TQ_DJANGO_DEBUG
    secret:
      key: tq-django-debug
      create: provided
  - name: SIP_TQ_ALLOWED_HOSTS
    secret:
      key: tq-allowed-hosts
      create: provided
  - name: SIP_TQ_ENVIRONMENT
    secret:
      key: tq-environment
      create: provided

  # Email via Microsoft Graph (ETH service account)
  - name: SIP_TQ_MAIL_GRAPH_TENANT_ID
    secret:
      key: tq-mail-graph-tenant-id
      create: provided
  - name: SIP_TQ_MAIL_GRAPH_CLIENT_ID
    secret:
      key: tq-mail-graph-client-id
      create: provided
  - name: SIP_TQ_MAIL_GRAPH_CLIENT_SECRET
    secret:
      key: tq-mail-graph-client-secret
      create: provided
  - name: SIP_TQ_MAIL_SENDER
    secret:
      key: tq-mail-sender
      create: provided
  # OIDC
  - name: SIP_TQ_OIDC_CLIENT_ID
    secret:
      value: provided
      key: tq-oidc-client-id
  - name: SIP_TQ_OIDC_CLIENT_SECRET
    secret:
      value: provided
      key: tq-oidc-client-secret
  - name: SIP_TQ_OIDC_IDP_CONFIGURATION
    secret:
      value: provided
      key: tq-oidc-idp-configuration
  - name: SIP_TQ_OIDC_REDIRECT_URI
    secret:
      value: provided
      key: tq-oidc-redirect-uri
  - name: SIP_TQ_OIDC_SCOPES
    secret:
      value: provided
      key: tq-oidc-scopes
