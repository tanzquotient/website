{% extends "admin/change_form.html" %}

{% block after_field_sets %}
  {{ block.super }}
  {% if short_url %}
    <fieldset class="module aligned">
      <h2>Share this short URL</h2>
      <p>
        <input type="text" value="{{ short_url }}" readonly size="100" aria-label="Short URL">
      </p>
      <p>
        <a href="{{ short_url }}" target="_blank" rel="noopener">Open short URL</a>
        · <a href="{{ visits_url }}">View visits for this short URL</a>
        · <a href="{{ chart_url }}">View destination chart</a>
      </p>
      <img src="{{ qr_code_data }}" width="240" height="240" alt="QR code for this short URL">
    </fieldset>
  {% endif %}
{% endblock %}
