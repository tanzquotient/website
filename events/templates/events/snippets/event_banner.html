{% load i18n %}

{% if not event.published %}
    <span class="banner">
        <i class="bi bi-eye-slash"></i>
        {% trans "Unpublished" %}
    </span>
{% elif event.is_cancelled %}
    <span class="banner">
        <i class="bi bi-ban"></i>
        {% trans "Cancelled" %}
    </span>
{% elif event.special %}
    <span class="banner">
        <i class="bi bi-star-fill"></i>
        {% trans "Special" %}
    </span>
{% endif %}
